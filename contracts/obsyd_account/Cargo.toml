[package]
name = "obsyd_account"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Obsyd passkey smart-contract wallet: a Soroban custom account authenticated by WebAuthn (ES256 / secp256r1) assertions, with short-lived session keys, per-token spend limits and guardian recovery."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
sha2 = { version = "0.10.8", default-features = false }
rand = "0.8.5"
